<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InteractX — Frontend. Reimagined.</title>
  <meta name="description" content="A premium interactive showcase of modern frontend libraries — Three.js, GSAP, Chart.js and more." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- GSAP synchronous (needed immediately for preloader) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <!-- Other libraries (preloader masks load time) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js" defer></script>

  <style>
  /* ══════════════════════════════════════════
     RESET
  ══════════════════════════════════════════ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  img, svg { display: block; }

  /* ══════════════════════════════════════════
     CUSTOM PROPERTIES
  ══════════════════════════════════════════ */
  :root {
    --bg-primary:        #0a0a0f;
    --bg-secondary:      #0f0f1a;
    --bg-tertiary:       #141428;
    --bg-card:           rgba(15,15,26,0.92);

    --accent-cyan:       #00d4ff;
    --accent-cyan-dim:   rgba(0,212,255,0.15);
    --accent-purple:     #7c3aed;
    --accent-purple-l:   #a78bfa;
    --accent-green:      #00ff88;
    --accent-pink:       #f72585;
    --accent-orange:     #ff6d00;

    --text-primary:      #ffffff;
    --text-secondary:    #a0aec0;
    --text-muted:        #4a5568;

    --glass:             rgba(255,255,255,0.05);
    --glass-strong:      rgba(255,255,255,0.08);
    --glass-border:      rgba(255,255,255,0.10);
    --glass-border-s:    rgba(255,255,255,0.18);

    --glow-cyan:         0 0 40px rgba(0,212,255,0.45),  0 0 80px rgba(0,212,255,0.15);
    --glow-purple:       0 0 40px rgba(124,58,237,0.45), 0 0 80px rgba(124,58,237,0.15);
    --glow-green:        0 0 40px rgba(0,255,136,0.45),  0 0 80px rgba(0,255,136,0.15);
    --glow-pink:         0 0 40px rgba(247,37,133,0.45), 0 0 80px rgba(247,37,133,0.15);

    --card-shadow:       0 8px 40px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;
    --max-w:             1200px;
    --sec-pad:           7rem 2rem;
    --nav-h:             70px;

    --font-sans:         'Inter', system-ui, sans-serif;
    --font-display:      'Space Grotesk', 'Inter', sans-serif;
    --font-mono:         'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  /* ══════════════════════════════════════════
     BASE
  ══════════════════════════════════════════ */
  html {
    scroll-behavior: smooth;
    height: 100%;
  }
  body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow-x: hidden;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Lenis smooth scroll */
  html.lenis { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto; }

  /* Text selection */
  ::selection { background: rgba(0,212,255,0.22); color: #fff; }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-purple));
    border-radius: 3px;
  }

  /* ══════════════════════════════════════════
     TYPOGRAPHY UTILITIES
  ══════════════════════════════════════════ */
  .grad {
    background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple-l) 50%, var(--accent-green) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .grad-warm {
    background: linear-gradient(135deg, #f72585 0%, #7c3aed 50%, #00d4ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ══════════════════════════════════════════
     GLASS CARD BASE
  ══════════════════════════════════════════ */
  .glass-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--card-shadow);
  }

  /* ══════════════════════════════════════════
     SECTION SHARED
  ══════════════════════════════════════════ */
  .sec { padding: var(--sec-pad); position: relative; z-index: 1; }
  .sec-inner { max-width: var(--max-w); margin: 0 auto; }

  .sec-eyebrow {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent-cyan); margin-bottom: 1rem;
  }
  .sec-eyebrow::before {
    content: '';
    width: 22px; height: 1px;
    background: var(--accent-cyan); opacity: 0.65; flex-shrink: 0;
  }

  .sec-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 4.5vw, 3.2rem);
    font-weight: 800; line-height: 1.08;
    letter-spacing: -0.04em; color: var(--text-primary);
    margin-bottom: 1rem;
  }
  .sec-sub {
    font-size: clamp(0.95rem, 1.7vw, 1.08rem);
    color: var(--text-secondary);
    line-height: 1.82; max-width: 560px;
  }
  .sec-head-c { text-align: center; margin-bottom: 4rem; }
  .sec-head-c .sec-sub { margin: 0 auto; }

  /* ══════════════════════════════════════════
     SCROLL PROGRESS
  ══════════════════════════════════════════ */
  #scroll-progress {
    position: fixed; top: 0; left: 0; right: 0;
    height: 2px; z-index: 10001; pointer-events: none;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-green));
    transform-origin: left; transform: scaleX(0);
    box-shadow: 0 0 10px rgba(0,212,255,0.6);
  }

  /* ══════════════════════════════════════════
     REVEAL CLASSES (GSAP-animated)
  ══════════════════════════════════════════ */
  .rv     { opacity: 0; transform: translateY(38px); }
  .rv-l   { opacity: 0; transform: translateX(-42px); }
  .rv-r   { opacity: 0; transform: translateX(42px); }
  .rv-s   { opacity: 0; transform: scale(0.88); }
  .rv-b   { opacity: 0; filter: blur(14px); transform: translateY(22px); }

  /* ══════════════════════════════════════════
     DIVIDER
  ══════════════════════════════════════════ */
  .divider {
    height: 1px; margin: 0 2rem;
    background: linear-gradient(90deg,
      transparent,
      rgba(0,212,255,0.12) 25%,
      rgba(124,58,237,0.12) 75%,
      transparent);
    position: relative; z-index: 1;
  }

  /* ══════════════════════════════════════════
     BUTTONS
  ══════════════════════════════════════════ */
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.85rem 2.2rem; border-radius: 50px;
    font-family: var(--font-sans); font-size: 0.92rem; font-weight: 700;
    letter-spacing: -0.01em; text-decoration: none;
    cursor: pointer; border: none; position: relative; overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.22,0.61,0.36,1),
                box-shadow 0.3s;
  }
  .btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 55%);
    opacity: 0; transition: opacity 0.3s;
  }
  .btn:hover { transform: translateY(-3px); }
  .btn:hover::before { opacity: 1; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    color: #fff;
    box-shadow: 0 6px 28px rgba(0,212,255,0.38), 0 1px 0 rgba(255,255,255,0.15) inset;
  }
  .btn-primary:hover {
    box-shadow: 0 12px 40px rgba(0,212,255,0.5), 0 1px 0 rgba(255,255,255,0.15) inset;
  }

  .btn-ghost {
    background: var(--glass);
    border: 1px solid var(--glass-border-s);
    color: var(--text-primary);
    backdrop-filter: blur(10px);
  }
  .btn-ghost:hover {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 24px rgba(0,212,255,0.2);
    background: rgba(0,212,255,0.08);
  }

  /* ══════════════════════════════════════════
     PRELOADER
  ══════════════════════════════════════════ */
  #loader {
    position: fixed; inset: 0; z-index: 99999;
    background: var(--bg-primary);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* Subtle scanline atmosphere */
  #loader::before {
    content: '';
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,212,255,0.014) 2px, rgba(0,212,255,0.014) 4px
    );
  }

  /* Background radial glow */
  #loader::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 900px; height: 500px;
    background: radial-gradient(ellipse, rgba(0,212,255,0.05) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }

  /* HUD corner brackets */
  .ldr-corner {
    position: absolute; width: 26px; height: 26px;
    z-index: 3; opacity: 0.35;
  }
  .ldr-corner.tl { top: 28px; left: 28px;
    border-top: 1px solid var(--accent-cyan); border-left: 1px solid var(--accent-cyan); }
  .ldr-corner.tr { top: 28px; right: 28px;
    border-top: 1px solid var(--accent-cyan); border-right: 1px solid var(--accent-cyan); }
  .ldr-corner.bl { bottom: 28px; left: 28px;
    border-bottom: 1px solid var(--accent-cyan); border-left: 1px solid var(--accent-cyan); }
  .ldr-corner.br { bottom: 28px; right: 28px;
    border-bottom: 1px solid var(--accent-cyan); border-right: 1px solid var(--accent-cyan); }

  /* Logo + tagline */
  .ldr-logo {
    position: relative; z-index: 2;
    font-family: var(--font-display);
    font-size: clamp(2.4rem, 5.5vw, 3.6rem);
    font-weight: 800; letter-spacing: -0.045em;
    background: linear-gradient(135deg, #ffffff 0%, rgba(0,212,255,0.92) 55%, rgba(124,58,237,0.85) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 0.35rem;
    opacity: 0; transform: translateY(10px);
  }
  .ldr-tagline {
    position: relative; z-index: 2;
    font-family: var(--font-mono);
    font-size: 0.7rem; font-weight: 400;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(0,212,255,0.45);
    margin-bottom: 2.8rem;
    opacity: 0;
  }

  /* ── Car scene ── */
  .ldr-scene {
    position: relative; z-index: 2;
    width: 100vw; height: 110px;
    display: flex; align-items: center;
    overflow: hidden;
    margin-bottom: 2.2rem;
  }

  /* Ground line */
  .ldr-ground {
    position: absolute; bottom: 14px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      rgba(0,212,255,0.06) 10%,
      rgba(0,212,255,0.22) 50%,
      rgba(0,212,255,0.06) 90%,
      transparent);
  }

  /* Speed lines (CSS only animation) */
  .ldr-speed { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .sl {
    position: absolute; left: -60%; height: 1px; border-radius: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
    animation: slAnim linear infinite;
  }
  .sl:nth-child(1) { top: 22%; width: 32%; animation-duration: 1.55s; animation-delay: 0s; }
  .sl:nth-child(2) { top: 40%; width: 52%; animation-duration: 1.80s; animation-delay: 0.28s; }
  .sl:nth-child(3) { top: 58%; width: 38%; animation-duration: 1.65s; animation-delay: 0.12s; }
  .sl:nth-child(4) { top: 73%; width: 28%; animation-duration: 2.00s; animation-delay: 0.44s; }
  @keyframes slAnim {
    0%   { transform: translateX(0); opacity: 0; }
    8%   { opacity: 1; }
    100% { transform: translateX(210vw); opacity: 0; }
  }

  /* ── Car wrapper (GSAP translateX) ── */
  #ldr-car {
    position: absolute; top: 50%;
    transform: translateY(-50%);
    display: flex; align-items: center;
    will-change: transform;
  }

  /* Light trail behind car */
  .ldr-trail {
    position: absolute;
    right: calc(100% - 25px);
    top: 50%; transform: translateY(-50%);
    width: 380px; height: 55px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(0,212,255,0.02) 25%,
      rgba(0,212,255,0.18) 60%,
      rgba(0,212,255,0.55) 85%,
      rgba(0,212,255,0.65) 100%);
    filter: blur(7px);
    border-radius: 50%;
    pointer-events: none;
  }
  .ldr-trail::after {
    content: '';
    position: absolute; right: 0; top: 50%;
    transform: translateY(-50%);
    width: 90px; height: 5px;
    background: linear-gradient(90deg, transparent, #00d4ff);
    border-radius: 3px; filter: blur(1.5px);
  }

  /* Headlight beam forward */
  .ldr-beam {
    position: absolute;
    left: calc(100% - 8px); top: 50%;
    transform: translateY(-50%);
    width: 180px; height: 38px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.5) 0%,
      rgba(0,212,255,0.22) 35%,
      transparent 100%);
    filter: blur(9px);
    clip-path: polygon(0 25%, 100% 0%, 100% 100%, 0 75%);
    pointer-events: none;
  }

  /* Car SVG glow */
  #ldr-car svg {
    filter: drop-shadow(0 0 7px rgba(0,212,255,0.65))
            drop-shadow(0 0 18px rgba(0,212,255,0.2));
  }

  /* ── Progress section ── */
  .ldr-progress {
    position: relative; z-index: 2;
    width: min(440px, 82vw);
    opacity: 0;
  }
  .ldr-bar-track {
    width: 100%; height: 2px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px; position: relative;
    margin-bottom: 0.75rem; overflow: visible;
  }
  .ldr-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-green));
    border-radius: 2px; position: relative;
    box-shadow: 0 0 10px rgba(0,212,255,0.55);
  }
  /* Glowing tip on bar */
  .ldr-bar-fill::after {
    content: '';
    position: absolute; right: -5px; top: 50%;
    transform: translateY(-50%);
    width: 11px; height: 11px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, var(--accent-cyan) 55%, transparent 80%);
    filter: blur(1px);
    box-shadow: 0 0 10px rgba(0,212,255,0.9), 0 0 22px rgba(0,212,255,0.4);
  }
  .ldr-bar-info {
    display: flex; justify-content: space-between; align-items: center;
  }
  .ldr-text {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--text-secondary);
    letter-spacing: 0.06em;
  }
  .ldr-pct {
    font-family: var(--font-mono);
    font-size: 0.7rem; font-weight: 600;
    color: var(--accent-cyan); letter-spacing: 0.12em;
  }

  /* ── Exit curtain ── */
  #ldr-curtain {
    position: fixed; inset: 0; z-index: 99998;
    background: var(--bg-primary);
    transform: translateY(100%);
    pointer-events: none;
  }
  </style>
</head>

<body>

  <!-- Scroll progress bar -->
  <div id="scroll-progress" aria-hidden="true"></div>

  <!-- ══════════════════════════════════════
       PRELOADER
  ══════════════════════════════════════ -->
  <div id="loader" role="status" aria-label="Loading InteractX">
    <div class="ldr-corner tl" aria-hidden="true"></div>
    <div class="ldr-corner tr" aria-hidden="true"></div>
    <div class="ldr-corner bl" aria-hidden="true"></div>
    <div class="ldr-corner br" aria-hidden="true"></div>

    <div class="ldr-logo">InteractX</div>
    <div class="ldr-tagline">Frontend. Reimagined. · v3.0</div>

    <!-- Car driving scene -->
    <div class="ldr-scene">
      <div class="ldr-speed" aria-hidden="true">
        <div class="sl"></div><div class="sl"></div>
        <div class="sl"></div><div class="sl"></div>
      </div>
      <div class="ldr-ground"></div>

      <div id="ldr-car">
        <div class="ldr-trail"></div>

        <!-- Inline SVG sports car side-profile -->
        <svg viewBox="0 0 288 102" width="288" height="102" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <filter id="cg" x="-25%" y="-60%" width="150%" height="220%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <linearGradient id="bd" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0d1b2a"/>
              <stop offset="100%" stop-color="#080f1e"/>
            </linearGradient>
          </defs>
          <!-- Ground shadow -->
          <ellipse cx="144" cy="98" rx="118" ry="5" fill="rgba(0,212,255,0.09)"/>
          <!-- Main body -->
          <path d="M20 62 L20 53 Q20 45 30 45 L60 45 L86 19 L192 17 L218 45 L264 45 Q272 45 272 53 L272 66 L20 66 Z"
                fill="url(#bd)" stroke="#00d4ff" stroke-width="1.5" filter="url(#cg)"/>
          <!-- Roofline -->
          <path d="M88 44 L112 21 L190 19 L215 44 Z"
                fill="rgba(0,14,30,0.85)" stroke="rgba(0,212,255,0.45)" stroke-width="1"/>
          <!-- Windshield glass -->
          <path d="M114 43 L130 23 L188 21 L212 43 Z"
                fill="rgba(0,212,255,0.16)" stroke="rgba(0,212,255,0.52)" stroke-width="1"/>
          <!-- B-pillar -->
          <line x1="162" y1="22" x2="160" y2="43" stroke="rgba(0,212,255,0.42)" stroke-width="1.4"/>
          <!-- Headlights (front = right) -->
          <rect x="262" y="49" width="22" height="9" rx="3.5" fill="rgba(255,255,255,0.95)" filter="url(#cg)"/>
          <rect x="260" y="44" width="17" height="6" rx="2.5" fill="#00d4ff" opacity="0.88" filter="url(#cg)"/>
          <!-- Tail lights (rear = left) -->
          <rect x="6" y="46" width="16" height="16" rx="3" fill="#ff1a4f" opacity="0.88" filter="url(#cg)"/>
          <!-- Body accent crease -->
          <path d="M30 57 L58 57 M80 57 L202 57 M218 57 L262 57" stroke="rgba(0,212,255,0.16)" stroke-width="1"/>
          <!-- Spoiler -->
          <rect x="8" y="35" width="22" height="6" rx="2.5" fill="url(#bd)" stroke="rgba(0,212,255,0.38)" stroke-width="1" filter="url(#cg)"/>
          <line x1="10" y1="41" x2="10" y2="47" stroke="rgba(0,212,255,0.28)" stroke-width="1"/>
          <line x1="28" y1="41" x2="28" y2="47" stroke="rgba(0,212,255,0.28)" stroke-width="1"/>
          <!-- Side vent -->
          <rect x="224" y="47" width="24" height="3.5" rx="1.5" fill="rgba(0,212,255,0.22)" stroke="rgba(0,212,255,0.32)" stroke-width="0.6"/>
          <rect x="224" y="53" width="18" height="3.5" rx="1.5" fill="rgba(0,212,255,0.15)" stroke="rgba(0,212,255,0.22)" stroke-width="0.6"/>
          <!-- Wheel arch cutouts -->
          <circle cx="75" cy="66" r="23" fill="#0a0a0f"/>
          <circle cx="214" cy="66" r="23" fill="#0a0a0f"/>
          <!-- === REAR WHEEL (75, 66) === -->
          <circle cx="75" cy="66" r="22" fill="#0c0c14" stroke="#00d4ff" stroke-width="1.7" filter="url(#cg)"/>
          <circle cx="75" cy="66" r="13" fill="#090909" stroke="rgba(0,212,255,0.32)" stroke-width="1"/>
          <!-- 5 spokes: angles 0,72,144,216,288 deg from top -->
          <line x1="75" y1="59" x2="75" y2="53"     stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
          <line x1="82" y1="63" x2="87" y2="58"     stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
          <line x1="79" y1="72" x2="83" y2="77"     stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
          <line x1="71" y1="72" x2="67" y2="77"     stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
          <line x1="68" y1="63" x2="63" y2="58"     stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
          <circle cx="75" cy="66" r="5" fill="#00d4ff" opacity="0.82"/>
          <!-- === FRONT WHEEL (214, 66) === -->

  <!-- ═══════════════════════════════════════════
       SITE CONTENT — phases 2-6 appended below
  ═══════════════════════════════════════════ -->

  <!-- Preloader script: runs immediately, sets window._loaderDone when finished -->
  <script>
  (function () {
    const loaderEl = document.getElementById('loader');
    const ldrBar   = document.getElementById('ldr-bar');
    const ldrPct   = document.getElementById('ldr-pct');
    const ldrCar   = document.getElementById('ldr-car');
    const curtain  = document.getElementById('ldr-curtain');

    // Park car off-screen left
    gsap.set(ldrCar, { x: -360 });

    const tl = gsap.timeline({ delay: 0.25 });

    // Fade in logo + tagline
    tl.to('.ldr-logo',     { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' })
      .to('.ldr-tagline',  { opacity: 1,        duration: 0.4,  ease: 'power2.out' }, '-=0.3')
      .to('.ldr-progress', { opacity: 1,        duration: 0.35, ease: 'power2.out' }, '-=0.2');

    // Drive the car + fill bar simultaneously
    const st = { v: 0 };
    tl.to(st, {
      v: 100, duration: 2.25, ease: 'power2.inOut',
      onUpdate () {
        const p = st.v / 100;
        gsap.set(ldrCar, { x: -360 + p * (window.innerWidth + 720) });
        ldrBar.style.width  = st.v + '%';
        ldrPct.textContent  = Math.round(st.v) + '%';
      },
      onComplete () {
        // Curtain wipe reveal
        gsap.delayedCall(0.22, function () {
          gsap.set(curtain, { y: '100%' });
          gsap.to(curtain, {
            y: '0%', duration: 0.58, ease: 'expo.inOut',
            onComplete () {
              loaderEl.style.display = 'none';
              gsap.to(curtain, {
                y: '-100%', duration: 0.65, ease: 'expo.inOut',
                onComplete () {
                  curtain.style.display = 'none';
                  if (typeof window._startSite === 'function') window._startSite();
                  else window._loaderDone = true;
                }
              });
            }
          });
        });
      }
    }, '-=0.15');
  }());
  </script>
